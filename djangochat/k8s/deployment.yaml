apiVersion: apps/v1
kind: Deployment

metadata:
  name: django-chatops
  namespace: chatops
spec:
  replicas: 2

  selector:
    matchLabels:
      app: django-chatops

  template:
    metadata:
      labels:
        app: django-chatops

    spec:
      containers:
        - name: django-chatops
          image: chatops:latest
          imagePullPolicy: Never


          envFrom:
            - configMapRef:
                name: django-chatops-config
            - secretRef:
                name: django-chatops-secret




          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
            limits:
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
